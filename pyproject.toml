[project]
name = "rsna-knee-abnormality-detection"
version = "0.1.0"
description = "Study-level MRI training and offline inference for RSNA Knee Abnormality Detection"
readme = "README.md"
authors = [
    { name = "maxthenobody" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "iterative-stratification>=0.1.9,<0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.2,<3",
    "opencv-python-headless==4.12.0.88",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "pydicom>=3.0,<4",
    "pyjpegls>=1.5,<2",
    "pylibjpeg>=2.0,<3",
    "pylibjpeg-libjpeg>=2.3,<3",
    "pylibjpeg-openjpeg>=2.5,<3",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
    "tensorboard>=2.20,<3",
    "timm==1.0.26",
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "tqdm>=4.67,<5",
]

[project.scripts]
rsna-knee-abnormality-detection = "rsna_knee_abnormality_detection:main"
knee = "rsna_knee_abnormality_detection.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-10-13T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
